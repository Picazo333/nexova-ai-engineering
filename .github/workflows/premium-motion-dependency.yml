name: Premium Motion Dependency

on:
  push:
    branches:
      - implementation/nexova-premium-production
    paths:
      - ".github/workflows/premium-motion-dependency.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked GSAP dependency
        run: npm install gsap@3.15.0 --workspace @nexova/website --save-exact --no-audit --no-fund

      - name: Commit package metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json uis/website/package.json
          if git diff --cached --quiet; then
            echo "Dependency metadata unchanged."
          else
            git commit -m "build: add GSAP for signature scroll sequence"
            git push origin HEAD:implementation/nexova-premium-production
          fi
