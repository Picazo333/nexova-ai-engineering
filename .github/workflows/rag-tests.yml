name: RAG unit tests

on:
  pull_request:
  push:
    branches:
      - main
      - feature/rag-knowledge-base

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run python -m pytest tests/pipelines/test_rag.py tests/process tests/api tests/test_project_constraints.py
