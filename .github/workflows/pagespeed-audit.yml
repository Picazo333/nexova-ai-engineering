name: Lighthouse evidence

on:
  push:
    branches:
      - audit/pagespeed-20260929

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_URL: https://raw.githack.com/Picazo333/nexova-ai-engineering/2162745a4537cc1034d54264330c68d693348b13/index.html
    steps:
      - name: Verify public exact-commit target
        shell: bash
        run: |
          curl -fSsL --retry 6 --retry-delay 3 --retry-all-errors "$TARGET_URL" -o /tmp/public.html
          grep -qi "Nexova" /tmp/public.html

      - name: Run Lighthouse mobile
        shell: bash
        run: |
          npx --yes lighthouse@latest "$TARGET_URL" \
            --quiet \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=html \
            --output=json \
            --output-path=./lighthouse-mobile
          jq -r '{finalUrl:.finalUrl,fetchTime:.fetchTime,scores:{performance:(.categories.performance.score*100),accessibility:(.categories.accessibility.score*100),best_practices:(.categories["best-practices"].score*100),seo:(.categories.seo.score*100)},lab:{FCP:.audits["first-contentful-paint"].displayValue,LCP:.audits["largest-contentful-paint"].displayValue,TBT:.audits["total-blocking-time"].displayValue,CLS:.audits["cumulative-layout-shift"].displayValue}}' lighthouse-mobile.report.json
          jq -e '.categories.performance.score >= 0.80 and .categories.accessibility.score >= 0.80 and .categories["best-practices"].score >= 0.80 and .categories.seo.score >= 0.80' lighthouse-mobile.report.json >/dev/null

      - name: Screenshot Lighthouse report
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          "$CHROME" --headless --no-sandbox --disable-gpu \
            --window-size=1440,2200 \
            --screenshot=lighthouse-mobile.png \
            "file://$PWD/lighthouse-mobile.report.html"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-evidence
          path: |
            lighthouse-mobile.png
            lighthouse-mobile.report.html
            lighthouse-mobile.report.json
