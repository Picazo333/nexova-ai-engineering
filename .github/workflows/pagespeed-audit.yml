name: Public Lighthouse audit

on:
  push:
    branches:
      - audit/pagespeed-20260929

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Audit deployed site (mobile Lighthouse)
        shell: bash
        env:
          TARGET_URL: https://nexova-premium-v0-challenger-git-milesto-e3e106-mbpicazo33-1986.vercel.app/
        run: |
          set -euo pipefail
          echo "Target: $TARGET_URL"
          npx --yes lighthouse@latest "$TARGET_URL" \
            --quiet \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=lhr.json
          jq -r '{finalUrl:.finalUrl,fetchTime:.fetchTime,scores:{performance:(.categories.performance.score*100),accessibility:(.categories.accessibility.score*100),best_practices:(.categories["best-practices"].score*100),seo:(.categories.seo.score*100)},lab:{FCP:.audits["first-contentful-paint"].displayValue,LCP:.audits["largest-contentful-paint"].displayValue,TBT:.audits["total-blocking-time"].displayValue,CLS:.audits["cumulative-layout-shift"].displayValue,SI:.audits["speed-index"].displayValue}}' lhr.json
          jq -e '.categories.performance.score >= 0.80 and .categories.accessibility.score >= 0.80 and .categories["best-practices"].score >= 0.80 and .categories.seo.score >= 0.80' lhr.json >/dev/null
