name: sales-forecast

on:
  pull_request:
  push:
    branches: [main, feature/sales-forecast-model]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run pytest
      - run: uv run python scripts/train_sales_forecast.py
