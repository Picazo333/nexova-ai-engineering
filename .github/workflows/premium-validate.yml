name: Premium Validate

on:
  push:
    branches:
      - codex/premium-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  premium:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Start runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run dev:website > /tmp/nexova-website.log 2>&1 &
          echo $! > /tmp/nexova-website.pid
          npm run dev:backoffice > /tmp/nexova-backoffice.log 2>&1 &
          echo $! > /tmp/nexova-backoffice.pid

          for port in 3000 3001; do
            ready=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "http://127.0.0.1:$port/" > /dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Server on port $port did not become ready."
              cat "/tmp/nexova-$([ "$port" = "3000" ] && echo website || echo backoffice).log" || true
              exit 1
            fi
          done

      - name: Capture responsive evidence
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium not found on runner."
            exit 1
          fi

          mkdir -p docs/evidence/website-premium

          for width in 1440 1024 768 430 390; do
            "$CHROME_BIN" --headless --no-sandbox --disable-gpu --hide-scrollbars               --virtual-time-budget=2500 --window-size="$width",5200               --screenshot="docs/evidence/website-premium/runtime-$width.png"               http://127.0.0.1:3000/
          done

          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --hide-scrollbars             --blink-settings=scriptEnabled=false             --virtual-time-budget=1500 --window-size=390,5200             --screenshot=docs/evidence/website-premium/no-js-390.png             http://127.0.0.1:3000/

          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --hide-scrollbars             --force-prefers-reduced-motion             --virtual-time-budget=2500 --window-size=390,5200             --screenshot=docs/evidence/website-premium/reduced-motion-390.png             http://127.0.0.1:3000/

      - name: Lighthouse performance and accessibility
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          npx --yes lighthouse@12 http://127.0.0.1:3000/             --chrome-path="$CHROME_BIN"             --chrome-flags="--headless --no-sandbox --disable-gpu"             --only-categories=performance,accessibility             --output=json             --output-path=docs/evidence/website-premium/lighthouse.json             --quiet

      - name: Upload premium evidence
        uses: actions/upload-artifact@v4
        with:
          name: website-premium-h3
          path: |
            docs/evidence/website-premium/*.png
            docs/evidence/website-premium/lighthouse.json
          if-no-files-found: error
          retention-days: 7

      - name: Stop runtime
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/nexova-website.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/nexova-backoffice.pid 2>/dev/null)" 2>/dev/null || true
