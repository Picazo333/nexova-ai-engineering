name: Premium Validate

on:
  push:
    branches:
      - codex/premium-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Runtime smoke and visual capture
        shell: bash
        run: |
          set -euo pipefail

          npm run dev:website > /tmp/nexova-website.log 2>&1 &
          WEBSITE_PID=$!
          npm run dev:backoffice > /tmp/nexova-backoffice.log 2>&1 &
          BACKOFFICE_PID=$!

          cleanup() {
            kill "$WEBSITE_PID" "$BACKOFFICE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for port in 3000 3001; do
            ready=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "http://127.0.0.1:$port/" > /dev/null; then
                ready=1
                break
              fi
              sleep 1
            done

            if [ "$ready" -ne 1 ]; then
              echo "Server on port $port did not become ready."
              if [ "$port" = "3000" ]; then
                cat /tmp/nexova-website.log || true
              else
                cat /tmp/nexova-backoffice.log || true
              fi
              exit 1
            fi
          done

          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium not found on runner."
            exit 1
          fi

          mkdir -p docs/evidence/website-premium

          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --hide-scrollbars             --virtual-time-budget=2500 --window-size=1440,5200             --screenshot=docs/evidence/website-premium/desktop-1440.png             http://127.0.0.1:3000/

          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --hide-scrollbars             --virtual-time-budget=2500 --window-size=390,5200             --screenshot=docs/evidence/website-premium/mobile-390.png             http://127.0.0.1:3000/

      - name: Upload premium visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: website-premium-preview
          path: |
            docs/evidence/website-premium/*.png
            docs/evidence/website-premium/lighthouse.json
          if-no-files-found: error
          retention-days: 7
