name: Premium Validate

on:
  push:
    branches:
      - codex/premium-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Runtime smoke
        shell: bash
        run: |
          set -euo pipefail

          npm run dev:website > /tmp/nexova-website.log 2>&1 &
          WEBSITE_PID=$!
          npm run dev:backoffice > /tmp/nexova-backoffice.log 2>&1 &
          BACKOFFICE_PID=$!

          cleanup() {
            kill "$WEBSITE_PID" "$BACKOFFICE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for port in 3000 3001; do
            ready=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "http://127.0.0.1:$port/" > /dev/null; then
                ready=1
                break
              fi
              sleep 1
            done

            if [ "$ready" -ne 1 ]; then
              echo "Server on port $port did not become ready."
              if [ "$port" = "3000" ]; then
                cat /tmp/nexova-website.log || true
              else
                cat /tmp/nexova-backoffice.log || true
              fi
              exit 1
            fi
          done
