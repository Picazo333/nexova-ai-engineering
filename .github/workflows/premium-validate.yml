name: Premium Validate

on:
  push:
    branches:
      - codex/premium-production
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  premium:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Visual contract source integrity
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'a1-hero-golden|a2-fibrous-golden' uis/website/src/App.tsx; then
            echo "Figma Golden proxy detected as runtime source."
            exit 1
          fi
          grep -q 'hero__fibers' uis/website/src/App.tsx
          grep -q '"gsap": "3.15.0"' uis/website/package.json
          grep -q '"@fontsource/ibm-plex-mono": "5.3.0"' uis/website/package.json
          python - <<'PY'
          from pathlib import Path
          import struct
          for name, min_w, min_h in [
              ("packages/design-system/assets/a1-hero-desktop.png", 900, 900),
              ("packages/design-system/assets/a1-hero-mobile.png", 900, 900),
          ]:
              data = Path(name).read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{name}: expected PNG")
              w, h = struct.unpack(">II", data[16:24])
              if w < min_w or h < min_h:
                  raise SystemExit(f"{name}: {w}x{h} below production threshold")
              print(f"{name}: {w}x{h} PASS")
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Start dev runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run dev:website > /tmp/nexova-website.log 2>&1 &
          echo $! > /tmp/nexova-website.pid
          npm run dev:backoffice > /tmp/nexova-backoffice.log 2>&1 &
          echo $! > /tmp/nexova-backoffice.pid

          for port in 3000 3001; do
            ready=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "http://127.0.0.1:$port/" > /dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Server on port $port did not become ready."
              exit 1
            fi
          done

      - name: Capture responsive evidence
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          mkdir -p docs/evidence/website-premium

          for width in 1440 1024 768 430 390; do
            "$CHROME_BIN" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size="$width",5200 --screenshot="docs/evidence/website-premium/runtime-$width.png" http://127.0.0.1:3000/
          done


      - name: Install ephemeral accessibility auditor
        shell: bash
        run: npm install --no-save --package-lock=false axe-core@4.10.3

      - name: Browser interaction and resilience audit
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" BASE_URL="http://127.0.0.1:3000/" node scripts/h3-browser-audit.mjs
          test -s docs/evidence/website-premium/browser-audit.json
          test -s docs/evidence/website-premium/no-js-390.png
          test -s docs/evidence/website-premium/reduced-motion-390.png

      - name: Lighthouse production preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview --workspace @nexova/website -- --host 0.0.0.0 --port 4173 > /tmp/nexova-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:4173/" > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/nexova-preview.log || true
            exit 1
          fi

          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          npx --yes lighthouse@12 http://127.0.0.1:4173/ --chrome-path="$CHROME_BIN" --chrome-flags="--headless --no-sandbox --disable-gpu" --only-categories=performance,accessibility --output=json --output-path=docs/evidence/website-premium/lighthouse.json --quiet

      - name: Verify deployed Vercel preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: ${{ github.api_url }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p docs/evidence/website-premium
          PREVIEW_URL=""

          for attempt in $(seq 1 60); do
            CHECKS_JSON="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GH_API/repos/$GH_REPO/commits/$GH_SHA/check-runs")"

            FEEDBACK_URL="$(printf '%s' "$CHECKS_JSON" \
              | jq -r '.check_runs[] | select(.name == "Vercel Preview Comments") | .output.summary // empty' \
              | grep -oE 'https://vercel\.live/open-feedback/[^?)]+' \
              | head -n 1 || true)"

            if [ -n "$FEEDBACK_URL" ]; then
              PREVIEW_URL="$(printf '%s' "$FEEDBACK_URL" | sed 's#https://vercel.live/open-feedback/#https://#')"
              if curl --fail --location --silent --show-error --max-time 20 "$PREVIEW_URL/" > /tmp/nexova-vercel-index.html; then
                break
              fi
            fi

            PREVIEW_URL=""
            sleep 5
          done

          if [ -z "$PREVIEW_URL" ]; then
            echo "Could not resolve a reachable Vercel preview for $GH_SHA"
            exit 1
          fi

          printf '%s\n' "$PREVIEW_URL" | tee docs/evidence/website-premium/vercel-preview-url.txt

          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"

          "$CHROME_BIN" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --virtual-time-budget=4000 \
            --window-size=1440,5200 \
            --dump-dom \
            "$PREVIEW_URL/" > docs/evidence/website-premium/vercel-deployed-dom.html

          echo "Raw response title:"
          grep -oE '<title>[^<]+' /tmp/nexova-vercel-index.html | head -n 1 || true
          echo "Rendered DOM title:"
          grep -oE '<title>[^<]+' docs/evidence/website-premium/vercel-deployed-dom.html | head -n 1 || true
          echo "Rendered root markers:"
          grep -oE 'id="root"|class="site-shell"|class="hero"' docs/evidence/website-premium/vercel-deployed-dom.html | sort | uniq -c || true

          if grep -q "Authentication Required" docs/evidence/website-premium/vercel-deployed-dom.html; then
            echo "VERCEL_DEPLOYMENT_PROTECTION_DETECTED"
            DEPLOYED_CONTENT_OK=false
          else
            grep -q "<title>Nexova Solutions" docs/evidence/website-premium/vercel-deployed-dom.html
            grep -q 'class="site-shell"' docs/evidence/website-premium/vercel-deployed-dom.html
            grep -q 'class="hero"' docs/evidence/website-premium/vercel-deployed-dom.html
            DEPLOYED_CONTENT_OK=true
          fi

          if grep -q "Internal Server Error" docs/evidence/website-premium/vercel-deployed-dom.html; then
            echo "Deployed preview rendered an internal server error."
            exit 1
          fi

          "$CHROME_BIN" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --virtual-time-budget=4000 \
            --window-size=1440,5200 \
            --screenshot=docs/evidence/website-premium/vercel-runtime-1440.png \
            "$PREVIEW_URL/"

          python - <<'PY'
          import json
          from pathlib import Path
          url = Path("docs/evidence/website-premium/vercel-preview-url.txt").read_text().strip()
          Path("docs/evidence/website-premium/vercel-deployment-check.json").write_text(
              json.dumps({
                  "reachable": True,
                  "rendered_dom": True,
                  "render_assertions": [
                      "title:Nexova Solutions",
                      "class:site-shell",
                      "class:hero",
                      "no:Internal Server Error"
                  ],
                  "preview_url": url
              }, indent=2) + "\n"
          )
          PY

      - name: Upload premium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-premium-h3
          path: |
            docs/evidence/website-premium/*.png
            docs/evidence/website-premium/lighthouse.json
            docs/evidence/website-premium/browser-audit.json
            docs/evidence/website-premium/axe.json
            docs/evidence/website-premium/vercel-preview-url.txt
            docs/evidence/website-premium/vercel-deployment-check.json
            docs/evidence/website-premium/vercel-deployed-dom.html
            package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Stop dev runtime
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/nexova-website.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/nexova-backoffice.pid 2>/dev/null)" 2>/dev/null || true
