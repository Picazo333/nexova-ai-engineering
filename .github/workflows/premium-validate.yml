name: Premium Validate

on:
  push:
    branches:
      - codex/premium-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  premium:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Start dev runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run dev:website > /tmp/nexova-website.log 2>&1 &
          echo $! > /tmp/nexova-website.pid
          npm run dev:backoffice > /tmp/nexova-backoffice.log 2>&1 &
          echo $! > /tmp/nexova-backoffice.pid

          for port in 3000 3001; do
            ready=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "http://127.0.0.1:$port/" > /dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Server on port $port did not become ready."
              exit 1
            fi
          done

      - name: Capture responsive evidence
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          mkdir -p docs/evidence/website-premium

          for width in 1440 1024 768 430 390; do
            "$CHROME_BIN" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size="$width",5200 --screenshot="docs/evidence/website-premium/runtime-$width.png" http://127.0.0.1:3000/
          done


      - name: Browser interaction and resilience audit
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" BASE_URL="http://127.0.0.1:3000/" node scripts/h3-browser-audit.mjs
          test -s docs/evidence/website-premium/browser-audit.json
          test -s docs/evidence/website-premium/no-js-390.png
          test -s docs/evidence/website-premium/reduced-motion-390.png

      - name: Lighthouse production preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview --workspace @nexova/website -- --host 0.0.0.0 --port 4173 > /tmp/nexova-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:4173/" > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/nexova-preview.log || true
            exit 1
          fi

          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          npx --yes lighthouse@12 http://127.0.0.1:4173/ --chrome-path="$CHROME_BIN" --chrome-flags="--headless --no-sandbox --disable-gpu" --only-categories=performance,accessibility --output=json --output-path=docs/evidence/website-premium/lighthouse.json --quiet

      - name: Upload premium evidence
        uses: actions/upload-artifact@v4
        with:
          name: website-premium-h3
          path: |
            docs/evidence/website-premium/*.png
            docs/evidence/website-premium/lighthouse.json
            docs/evidence/website-premium/browser-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Stop dev runtime
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/nexova-website.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/nexova-backoffice.pid 2>/dev/null)" 2>/dev/null || true
