[project]
name = "nexova-api"
version = "0.1.0"
description = "API de Nexova: incidencias y directorio de proveedores"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.33",
  "tinydb==4.8.2",
  "python-jose[cryptography]==3.5.0",
  "libpass[bcrypt]==1.9.4",
  "qdrant-client==1.20.0",
  "openai==3.46.0",
  "fastembed==0.9.1",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "routes"]

[tool.hatch.build.targets.wheel.force-include]
"seed.py" = "seed.py"
"models.py" = "models.py"
"database.py" = "database.py"
"directory.py" = "directory.py"
"seed_data.py" = "seed_data.py"
"labels.py" = "labels.py"
"main.py" = "main.py"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "../../packages", "../../packages/shared", "../.."]
testpaths = ["tests", "../../packages/incident_analysis/tests"]

[tool.coverage.run]
source = ["app.auth"]
branch = false

[tool.coverage.report]
show_missing = true
fail_under = 70
