services:
  uis:
    build:
      context: ./uis
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis:/app
      - website_node_modules:/app/website/node_modules
      - portal_node_modules:/app/portal/node_modules
      - backoffice_node_modules:/app/backoffice/node_modules
    env_file:
      - path: .env
        required: false
    networks:
      - monorepo-dev
    depends_on:
      services:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login && wget -q -O /dev/null http://127.0.0.1:3001/"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 240s
    init: true

  services:
    build:
      context: ./services
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    networks:
      - monorepo-dev
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    init: true

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - monorepo-dev

networks:
  monorepo-dev:
    name: monorepo-dev

volumes:
  qdrant_storage:
  website_node_modules:
  portal_node_modules:
  backoffice_node_modules:
