# Production override. Use it only on the VPS, with the gitignored .env that lives there.
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# There is no public URL in this file. The host publishes 3000, 3001 and 8000.

services:
  uis:
    build:
      target: prod
    volumes: !reset []
    restart: unless-stopped

  services:
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  qdrant:
    restart: unless-stopped
