[project]
name = "nexova-ai-engineering"
version = "0.1.0"
description = "Monorepo de Nexova. uv run pytest en esta raíz ejecuta la batería completa."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.33",
  "tinydb==4.8.2",
  "python-jose[cryptography]==3.5.0",
  "libpass[bcrypt]==1.9.4",
  "httpx==0.28.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
]
